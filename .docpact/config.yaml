version: 1
layout: repo
lastReviewedAt: "2026-09-23"
lastReviewedCommit: "1e4f48bf8359f5e9bacba5741d15b7ff78f2eb41"
lastReviewedNote: "Current Foundry documentation routing, ownership, and coverage rules are reviewed."

catalog:
  repos:
    - id: data-foundry
      path: .
      canonicalRepo: tiangong-lca/foundry
      entryDoc: AGENTS.md
      workflowDocs:
        - README.md
        - WORKFLOW.md
        - docs/architecture.md
        - docs/orchestration-module-contract.md
        - docs/capability-ownership-policy.md
        - docs/runtime-skill-management.md
        - docs/package-distribution-contract.md
        - docs/env-surface-policy.md
        - docs/foundry-task-contracts.md
        - docs/safety-policy.md
        - docs/foundry-ai-navigation.md
        - docs/foundry-command-surface.md
        - docs/incremental-change-set-contract.md
        - docs/topology-convergence-contract.md
        - docs/final-delivery-promotion-contract.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - WORKFLOW.md
          - .docpact/config.yaml
          - docs/**/*.md
          - docs/file-location-registry.json
      ownerRepo: data-foundry
    - id: foundry-control-plane
      paths:
        include:
          - .codex/hooks/**
          - .codex/hooks.json
          - .env.example
          - .gitattributes
          - .github/workflows/**
          - .husky/**
          - .nvmrc
          - .oxlintrc.json
          - .prettierignore
          - package.json
          - pnpm-lock.yaml
          - pnpm-workspace.yaml
          - prettier.config.ts
          - scripts/**
          - specs/automated-lca-capability-registry.json
          - specs/canonical-support/**
          - specs/capability-ownership-rules.json
          - specs/data-foundry-service.md
          - specs/prewrite-content-policy.json
          - specs/orchestration-module-budgets.json
          - specs/schemas/**
          - test/unit/zero-javascript-ratchet.test.mts
          - specs/workspace-capability-adapters.md
          - tsconfig*.json
      ownerRepo: data-foundry
    - id: foundry-test-harness
      paths:
        include:
          - test/**
      ownerRepo: data-foundry
    - id: import-profiles
      paths:
        include:
          - specs/import-profiles.json
          - docs/import-profiles/**
      ownerRepo: data-foundry
    - id: foundry-local-skills
      paths:
        include:
          - .agents/shared-skills.json
          - .agents/skills/**
      ownerRepo: data-foundry
    - id: runtime-skill-cache-boundary
      paths:
        include:
          - .gitignore
      ownerRepo: data-foundry

coverage:
  include:
    - AGENTS.md
    - README.md
    - WORKFLOW.md
    - .docpact/config.yaml
    - .gitignore
    - .github/workflows/**
    - .husky/**
    - .nvmrc
    - .oxlintrc.json
    - .prettierignore
    - package.json
    - pnpm-lock.yaml
    - pnpm-workspace.yaml
    - prettier.config.ts
    - scripts/**
    - test/**
    - specs/**
    - tsconfig*.json
    - docs/**
    - .agents/shared-skills.json
    - .agents/skills/**
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - .foundry/**
    - tasks/**
    - artifacts/**
    - "*.log"

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - WORKFLOW.md
        - .docpact/config.yaml
        - docs/**/*.md
    control-plane:
      paths:
        - .github/workflows/**
        - .husky/**
        - .nvmrc
        - .oxlintrc.json
        - .prettierignore
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - prettier.config.ts
        - scripts/**
        - specs/automated-lca-capability-registry.json
        - specs/canonical-support/**
        - specs/capability-ownership-rules.json
        - specs/data-foundry-service.md
        - specs/prewrite-content-policy.json
        - specs/orchestration-module-budgets.json
        - specs/schemas/**
        - test/unit/zero-javascript-ratchet.test.mts
        - specs/workspace-capability-adapters.md
        - tsconfig*.json
    import-profile:
      paths:
        - specs/import-profiles.json
        - docs/import-profiles/**
    runtime-skills:
      paths:
        - .gitignore
        - .agents/shared-skills.json
        - docs/runtime-skill-management.md
        - .agents/skills/**
    workspace-ledger:
      paths:
        - docs/file-location-registry.json
        - docs/foundry-task-contracts.md
    proof:
      paths:
        - scripts/foundry.ts
        - package.json
        - README.md
        - WORKFLOW.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - WORKFLOW.md
    - .docpact/config.yaml
    - docs/architecture.md
    - docs/orchestration-module-contract.md
    - docs/capability-ownership-policy.md
    - docs/runtime-skill-management.md
    - docs/env-surface-policy.md
    - docs/foundry-task-contracts.md
    - docs/task-authorization-contract.md
    - docs/runtime-context-contract.md
    - docs/public-runtime-contract.md
    - docs/package-distribution-contract.md
    - docs/safety-policy.md
    - docs/foundry-ai-navigation.md
    - docs/foundry-command-surface.md
    - docs/execution-capsule-contract.md
    - docs/incremental-change-set-contract.md
    - docs/topology-convergence-contract.md
    - docs/final-delivery-promotion-contract.md
    - test/README.md
    - docs/account-context-policy.md
    - docs/countable-product-functional-unit-design.md
    - docs/codex-stop-hook.md
    - docs/file-organization.md
    - docs/workspace-project-map.md
    - docs/agent-harness-cli-comparison.md
    - docs/data-governance-loop.md
    - docs/symphony-adaptation.md
    - specs/data-foundry-service.md
    - specs/workspace-capability-adapters.md

repo:
  id: data-foundry
  owner: data-foundry

rules:
  - id: foundry-bootstrap-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: AGENTS.md
        kind: doc-contract
      - path: README.md
        kind: repo-landing
      - path: WORKFLOW.md
        kind: workflow-contract
      - path: .docpact/config.yaml
        kind: doc-governance-layer
      - path: docs/architecture.md
        kind: architecture-contract
      - path: docs/capability-ownership-policy.md
        kind: ownership-policy
      - path: docs/workspace-project-map.md
        kind: workspace-routing-reference
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: WORKFLOW.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: must_exist
      - path: docs/architecture.md
        mode: review_or_update
    reason: Repo entry docs, workflow guidance, and docpact routing must stay aligned with the thin-control-plane contract.
  - id: foundry-control-plane-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: .codex/hooks/**
        kind: agent-acceptance-hook
      - path: .codex/hooks.json
        kind: agent-hook-config
      - path: .env.example
        kind: runtime-env-surface
      - path: .gitattributes
        kind: cross-platform-line-endings
      - path: .github/workflows/**
        kind: continuous-integration
      - path: .husky/**
        kind: local-delivery-gate
      - path: .nvmrc
        kind: node-runtime-contract
      - path: .oxlintrc.json
        kind: lint-contract
      - path: .prettierignore
        kind: formatter-ignore-contract
      - path: package.json
        kind: command-surface
      - path: pnpm-lock.yaml
        kind: dependency-lock
      - path: pnpm-workspace.yaml
        kind: package-workspace-contract
      - path: prettier.config.ts
        kind: formatter-contract
      - path: scripts/**
        kind: local-runtime
      - path: specs/automated-lca-capability-registry.json
        kind: capability-registry
      - path: specs/canonical-support/**
        kind: canonical-support-cache
      - path: specs/capability-ownership-rules.json
        kind: ownership-rules
      - path: specs/data-foundry-service.md
        kind: service-contract
      - path: specs/prewrite-content-policy.json
        kind: prewrite-content-policy
      - path: specs/schemas/**
        kind: artifact-schema-contract
      - path: specs/typescript-migration-*.json
        kind: retired-typescript-migration-artifact
      - path: test/unit/zero-javascript-ratchet.test.mts
        kind: zero-javascript-ratchet
      - path: specs/workspace-capability-adapters.md
        kind: adapter-contract
      - path: tsconfig*.json
        kind: typescript-build-contract
      - path: docs/safety-policy.md
        kind: remote-write-safety-policy
      - path: docs/foundry-ai-navigation.md
        kind: command-navigation
      - path: docs/foundry-command-surface.md
        kind: command-surface-doc
      - path: docs/countable-product-functional-unit-design.md
        kind: functional-unit-design
    requiredDocs:
      - path: README.md
        mode: review_or_update
      - path: WORKFLOW.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/capability-ownership-policy.md
        mode: review_or_update
      - path: docs/workspace-project-map.md
        mode: review_or_update
      - path: docs/codex-stop-hook.md
        mode: must_exist
      - path: docs/env-surface-policy.md
        mode: must_exist
      - path: test/unit/zero-javascript-ratchet.test.mts
        mode: must_exist
      - path: specs/capability-ownership-rules.json
        mode: must_exist
    reason: Command wrappers, route plans, and capability ownership changes must preserve Foundry as task/workspace/profile/gate control.
  - id: foundry-import-profile-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: specs/import-profiles.json
        kind: import-profile-index
      - path: docs/import-profiles/**
        kind: import-profile-doc
      - path: docs/bafu-import-runbook.md
        kind: bafu-import-runbook
    requiredDocs:
      - path: specs/import-profiles.json
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
    reason: Import profile constraints must remain generic profile contracts, not Foundry code paths.
  - id: foundry-worldsteel-support-mint-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: scripts/commands/worldsteel-batch-import-run.ts
        kind: worldsteel-frozen-runner-policy
      - path: test/unit/worldsteel-support-mint-truth.test.mts
        kind: worldsteel-policy-contract-test
      - path: docs/import-profiles/worldsteel/**
        kind: worldsteel-profile-doc
    requiredDocs:
      - path: specs/import-profiles.json
        mode: review_or_update
      - path: docs/import-profiles/worldsteel/profile.md
        mode: review_or_update
      - path: docs/import-profiles/worldsteel/constraints.md
        mode: review_or_update
      - path: docs/import-profiles/worldsteel/import-plan.md
        mode: review_or_update
      - path: docs/import-profiles/worldsteel/import-coverage.md
        mode: review_or_update
    reason: Changes from the Worldsteel wrapper, truth test, or profile-doc subtree must review the frozen adapter policy, profile authorization, current constraints and plan, and retained coverage evidence together; the monolithic profile index keeps its generic trigger to avoid unrelated fan-out.
  - id: foundry-task-authorization-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: docs/task-authorization-contract.md
        kind: task-authorization-contract
      - path: scripts/lib/task-authorization.ts
        kind: task-authorization-validator
      - path: scripts/lib/foundry-task-authorization.ts
        kind: persisted-task-authorization
      - path: scripts/lib/foundry-execution-admission.ts
        kind: final-child-execution-admission
      - path: scripts/lib/import-curation/internal/profiles-config.ts
        kind: rule-and-authorization-admission
      - path: scripts/lib/import-curation/mutation-manifest.ts
        kind: task-write-admission
      - path: scripts/commands/commit-handoff.ts
        kind: final-row-task-admission
      - path: scripts/commands/identity-decisions.ts
        kind: elementary-action-admission
      - path: specs/schemas/task-authorization.schema.json
        kind: task-authorization-schema
      - path: specs/schemas/authorization-derivation.schema.json
        kind: authorization-derivation-schema
      - path: specs/schemas/execution-context.schema.json
        kind: child-execution-context-schema
      - path: test/unit/task-authorization.test.mts
        kind: task-authorization-contract-test
      - path: test/unit/task-profile-authority.test.mts
        kind: profile-authority-contract-test
      - path: test/scenarios/foundry-execution-admission.test.mts
        kind: child-execution-admission-scenario
    requiredDocs:
      - path: docs/task-authorization-contract.md
        mode: review_or_update
    reason: Task exceptions need their own binding, action, evidence and legacy no-replay contract beyond the existing general control-plane and source-profile documentation.
  - id: foundry-runtime-context-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: scripts/lib/foundry-runtime-context.ts
        kind: explicit-runtime-roots
      - path: scripts/lib/foundry-runtime-paths.ts
        kind: package-layout-resolution
      - path: scripts/foundry-runtime.ts
        kind: consumer-command-adapter
      - path: scripts/foundry-facade.ts
        kind: public-facade-composition
      - path: scripts/lib/foundry-facade-store.ts
        kind: facade-request-revision-state
      - path: scripts/lib/foundry-migration-inventory.ts
        kind: read-only-migration-inventory
      - path: scripts/lib/foundry-runtime-command-policy.ts
        kind: all-command-runtime-disposition
      - path: scripts/lib/foundry-runtime-qualification.ts
        kind: component-runtime-qualification
      - path: scripts/lib/foundry-execution-admission.ts
        kind: qualified-child-execution
      - path: scripts/lib/tidas-adapter.ts
        kind: explicit-native-child-environment
      - path: scripts/lib/import-curation/internal/runtime-io.ts
        kind: scoped-runtime-io
      - path: scripts/lib/import-curation/curation-cleanup.ts
        kind: context-aware-command-owner
      - path: test/unit/runtime-layout.test.mts
        kind: runtime-layout-contract-test
      - path: test/unit/foundry-runtime-context.test.mts
        kind: runtime-context-contract-test
      - path: test/unit/foundry-runtime-command-policy.test.mts
        kind: command-disposition-contract-test
      - path: test/unit/foundry-runtime-qualification.test.mts
        kind: runtime-qualification-contract-test
      - path: test/unit/foundry-runtime-authority-schemas.test.mts
        kind: runtime-authority-schema-contract-test
      - path: test/unit/public-cli-runtime.test.mts
        kind: cli-runtime-consumer-contract-test
      - path: test/scenarios/runtime-workspace.test.mts
        kind: workspace-isolation-scenario
      - path: test/scenarios/foundry-public-facade.test.mts
        kind: public-facade-cli-scenario
      - path: test/scenarios/foundry-facade-request-store.test.mts
        kind: facade-request-revision-scenario
      - path: test/scenarios/foundry-execution-admission.test.mts
        kind: qualified-child-execution-scenario
      - path: docs/runtime-context-contract.md
        kind: runtime-context-contract
    requiredDocs:
      - path: docs/runtime-context-contract.md
        mode: review_or_update
      - path: docs/public-runtime-contract.md
        mode: must_exist
    reason: Explicit roots, package layout and input/output confinement form the consumer runtime boundary and must remain separate from developer maintenance.
  - id: foundry-package-distribution-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: package.json
        kind: public-package-manifest
      - path: pnpm-lock.yaml
        kind: package-production-closure-lock
      - path: tsconfig.package.json
        kind: public-package-compiler
      - path: scripts/package-entry.ts
        kind: public-package-bin
      - path: scripts/public-api.ts
        kind: public-package-api
      - path: scripts/build-foundry-package.ts
        kind: package-stage-builder
      - path: scripts/pack-foundry-package.ts
        kind: package-archive-builder
      - path: scripts/verify-foundry-package.ts
        kind: package-stage-verifier
      - path: scripts/release-*.ts
        kind: source-release-command
      - path: scripts/ci-*.ts
        kind: source-ci-command
      - path: scripts/lib/foundry-ci-*.ts
        kind: source-ci-integrity-policy
      - path: specs/ci/**
        kind: source-ci-test-partition
      - path: test/unit/foundry-ci-*.test.mts
        kind: source-ci-policy-test
      - path: .github/workflows/publish.yml
        kind: source-release-workflow
      - path: .github/workflows/quality-gate.yml
        kind: release-platform-qualification
      - path: scripts/lib/foundry-release-*.ts
        kind: source-release-integrity-policy
      - path: specs/release/**
        kind: source-release-upstream-asset
      - path: test/unit/foundry-release-*.test.mts
        kind: source-release-policy-test
      - path: test/commands/foundry-release-*.test.mts
        kind: source-release-command-test
      - path: scripts/lib/foundry-package-contract.ts
        kind: installed-package-integrity
      - path: scripts/lib/foundry-runtime-paths.ts
        kind: package-layout-resolution
      - path: specs/schemas/foundry-package-descriptor.schema.json
        kind: package-descriptor-schema
      - path: test/unit/foundry-package-contract.test.mts
        kind: package-contract-test
      - path: test/unit/runtime-layout.test.mts
        kind: package-layout-test
      - path: test/scenarios/foundry-package-consumer.test.mts
        kind: installed-package-scenario
      - path: docs/package-distribution-contract.md
        kind: package-distribution-contract
    requiredDocs:
      - path: docs/package-distribution-contract.md
        mode: review_or_update
      - path: docs/runtime-context-contract.md
        mode: review_or_update
      - path: docs/public-runtime-contract.md
        mode: review_or_update
      - path: docs/env-surface-policy.md
        mode: review_or_update
      - path: test/README.md
        mode: review_or_update
    reason: Package identity, sanitized staging, exact files, runtime layout, public entry/API, installed integrity and source release/provenance gates must stay coherent without introducing install hooks or business mutation authority.
  - id: foundry-public-runtime-protocol
    scope: repo
    repo: data-foundry
    triggers:
      - path: scripts/runtime-entry.ts
        kind: runtime-entry-adapter
      - path: scripts/foundry-facade.ts
        kind: public-facade-composition
      - path: scripts/lib/foundry-operation-result.ts
        kind: public-result-envelope
      - path: scripts/lib/foundry-task-start-spec.ts
        kind: public-task-intent
      - path: scripts/lib/foundry-facade-store.ts
        kind: public-request-revision-store
      - path: scripts/lib/foundry-migration-inventory.ts
        kind: public-migration-dry-run
      - path: specs/schemas/foundry-operation-result.schema.json
        kind: public-result-schema
      - path: specs/schemas/foundry-task-start.schema.json
        kind: public-task-spec-schema
      - path: specs/schemas/foundry-facade-request-index.schema.json
        kind: public-request-index-schema
      - path: specs/schemas/foundry-workspace-migration-plan.schema.json
        kind: public-migration-plan-schema
      - path: test/unit/foundry-operation-result.test.mts
        kind: public-result-contract-test
      - path: test/unit/foundry-task-start-spec.test.mts
        kind: public-task-spec-contract-test
      - path: test/unit/foundry-facade-schemas.test.mts
        kind: public-facade-schema-test
      - path: test/scenarios/foundry-public-facade.test.mts
        kind: public-facade-scenario
      - path: test/scenarios/foundry-facade-request-store.test.mts
        kind: public-request-state-scenario
      - path: docs/public-runtime-contract.md
        kind: public-runtime-protocol
    requiredDocs:
      - path: docs/public-runtime-contract.md
        mode: review_or_update
      - path: docs/runtime-context-contract.md
        mode: review_or_update
    reason: Entry adapters must preserve the normative public facade target while command availability is qualified separately.
  - id: foundry-persisted-task-boundary
    scope: repo
    repo: data-foundry
    triggers:
      - path: scripts/lib/foundry-task-*.ts
        kind: registered-task-state
      - path: scripts/lib/foundry-runtime-identity.ts
        kind: task-identity-verification
      - path: scripts/lib/foundry-runtime-qualification.ts
        kind: task-runtime-qualification
      - path: scripts/lib/foundry-execution-admission.ts
        kind: task-child-execution-admission
      - path: scripts/lib/foundry-facade-store.ts
        kind: facade-task-pointer-and-revisions
      - path: scripts/lib/foundry-task-start-spec.ts
        kind: facade-task-intent
      - path: test/scenarios/task-runtime-binding.test.mts
        kind: task-recovery-contract-test
      - path: test/scenarios/task-authorization-persistence.test.mts
        kind: persisted-authorization-contract-test
      - path: test/scenarios/foundry-execution-admission.test.mts
        kind: derived-authorization-and-child-admission-test
      - path: test/scenarios/foundry-facade-request-store.test.mts
        kind: facade-task-revision-and-no-replay-test
    requiredDocs:
      - path: docs/foundry-task-contracts.md
        mode: review_or_update
      - path: docs/task-authorization-contract.md
        mode: review_or_update
      - path: docs/runtime-context-contract.md
        mode: review_or_update
      - path: docs/env-surface-policy.md
        mode: review_or_update
    reason: Task/actor/account identity, immutable source/profile records, producer lineage and explicit approval evidence must remain distinct from login, business completion and mutation replay authority.
  - id: foundry-prewrite-datetime-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: scripts/lib/import-curation/internal/prewrite-cleanup.ts
        kind: strict-prewrite-datetime-owner
      - path: scripts/lib/import-curation/curation-cleanup.ts
        kind: cleanup-blocker-runner
      - path: scripts/lib/bundle-sample-utils.ts
        kind: bundle-datetime-preservation
      - path: scripts/commands/post-authoring-finalize.ts
        kind: finalize-cleanup-short-circuit
      - path: scripts/lib/foundry-command-registry.ts
        kind: cleanup-cli-exit-contract
      - path: test/unit/prewrite-cleanup-contract.test.mts
        kind: strict-datetime-unit-contract
      - path: test/unit/curation-cleanup-runner-contract.test.mts
        kind: cleanup-atomic-fail-close-contract
      - path: test/unit/bundle-sample-utils-contract.test.mts
        kind: bundle-rollover-regression-contract
      - path: test/unit/foundry-cli-spine.test.mts
        kind: cleanup-exit-code-contract
      - path: test/scenarios/curation-cleanup-quality-gates.test.mts
        kind: cleanup-cli-scenario
      - path: test/scenarios/post-authoring-finalize-gates.test.mts
        kind: finalize-short-circuit-scenario
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: WORKFLOW.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/foundry-ai-navigation.md
        mode: review_or_update
      - path: test/README.md
        mode: review_or_update
    reason: Strict datetime parsing, upstream evidence preservation, atomic cleanup blockers, non-destructive stale-output reporting, CLI failure, finalize short-circuiting, and AI/test navigation must remain synchronized.
  - id: foundry-execution-capsule-contract
    scope: repo
    repo: data-foundry
    triggers:
      - path: docs/execution-capsule-contract.md
        kind: execution-capsule-contract
      - path: specs/schemas/execution-capsule-stage.schema.json
